name = "x402cloud-facilitator"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
NETWORK = "eip155:84532"
OUR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
RPC_URL = "https://sepolia.base.org"

[route]
pattern = "facilitator.x402cloud.ai"
custom_domain = true

# FACILITATOR_PRIVATE_KEY should be set as a secret:
#   npx wrangler secret put FACILITATOR_PRIVATE_KEY

# FACILITATOR_API_TOKEN should be set as a secret:
#   npx wrangler secret put FACILITATOR_API_TOKEN

# ── Settlement idempotency (per-(scheme,nonce) records) ──────────────────────
# A Durable Object holds each (scheme,nonce) settlement record. One DO instance
# per nonce (addressed by idFromName("scheme:nonce")) is single-threaded with
# transactional, strongly-consistent storage, so every state transition (claim /
# recordTerminal / recordAwaitingReceipt / recordBroadcastRetry) is an ATOMIC
# read-modify-write. This gives a hard exactly-once-recorded guarantee — the
# lease and the sticky-success latch become real invariants, not narrowed races.
# (The earlier KV binding could not provide compare-and-set; self-hosters without
# Durable Objects can still use kvCoordinator from settlement-store.ts.)
[[durable_objects.bindings]]
name = "SETTLEMENT_DO"
class_name = "SettlementDO"

# SettlementDO uses the SQLite-backed storage backend (required for new DO
# classes on the Workers free + standard plans, and the recommended default).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SettlementDO"]

# ── Settlement retry queue (transient on-chain/RPC failures) ─────────────────
# Create the queues first:
#   npx wrangler queues create settle-retry
#   npx wrangler queues create settle-retry-dlq
[[queues.producers]]
binding = "SETTLE_QUEUE"
queue = "settle-retry"

[[queues.consumers]]
queue = "settle-retry"
# Queue owns backoff + exhaustion; on max_retries the message dead-letters.
max_retries = 5
max_batch_size = 10
max_batch_timeout = 5
dead_letter_queue = "settle-retry-dlq"

# ── Mainnet environment (config only — not deployed by this change) ─────────
# Per docs/MAINNET-RUNBOOK.md §5 step 1. RPC_URL is a placeholder — paste the
# operator's Alchemy/QuickNode Base mainnet URL before `wrangler deploy --env
# mainnet` (never commit a real RPC URL with an embedded API key). Secrets
# (FACILITATOR_PRIVATE_KEY, FACILITATOR_API_TOKEN) are set separately with
# `wrangler secret put <NAME> --env mainnet` — see runbook §4.
#
# CORRECTION (review finding, radekdymacz/workspace#44): named environments
# do NOT inherit bindings from the top level — only a handful of top-level
# keys (compatibility_date/flags, account_id, ...) carry over. A mainnet
# deploy without its own durable_objects/migrations/queues blocks would boot
# with vars but no SETTLEMENT_DO and no SETTLE_QUEUE binding, so every
# settle() call would throw at runtime. So the DO and the queues ARE
# redeclared below — each `[env.X]` still deploys as its own Worker script,
# so the DO gets its own storage for free even with the same class name, but
# the binding itself has to be named again. The queues get their own
# mainnet-suffixed names (create them first) rather than sharing
# "settle-retry" with testnet, per this PR's resource-naming convention.
[env.mainnet]
name = "x402cloud-facilitator-mainnet"

[env.mainnet.vars]
NETWORK = "eip155:8453"
OUR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
RPC_URL = "<alchemy-or-quicknode-base-mainnet-url>"

[env.mainnet.route]
pattern = "facilitator-mainnet.x402cloud.ai"
custom_domain = true

[[env.mainnet.durable_objects.bindings]]
name = "SETTLEMENT_DO"
class_name = "SettlementDO"

[[env.mainnet.migrations]]
tag = "v1"
new_sqlite_classes = ["SettlementDO"]

# Create these before `wrangler deploy --env mainnet`:
#   npx wrangler queues create settle-retry-mainnet
#   npx wrangler queues create settle-retry-mainnet-dlq
[[env.mainnet.queues.producers]]
binding = "SETTLE_QUEUE"
queue = "settle-retry-mainnet"

[[env.mainnet.queues.consumers]]
queue = "settle-retry-mainnet"
max_retries = 5
max_batch_size = 10
max_batch_timeout = 5
dead_letter_queue = "settle-retry-mainnet-dlq"
