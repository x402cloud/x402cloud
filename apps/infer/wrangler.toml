name = "infer-x402cloud"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
NETWORK = "base-sepolia"
FACILITATOR_URL = "https://facilitator.x402cloud.ai"
# Settlement wallet of the facilitator above (see its /supported endpoint).
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

# Durable settlement recording (reconciliation). When this binding is present,
# the payment middleware persists a `pending` record before each on-chain
# settle and overwrites it with `settled`/`failed` after — failures are also
# dead-lettered for a reconciliation sweep. Absent binding => safe no-op.
#
# Create the namespace once, then paste the returned id below and uncomment —
# a placeholder id makes `wrangler deploy` fail, so the block stays commented
# until the real id exists (absent binding is the documented safe no-op):
#   CLOUDFLARE_ACCOUNT_ID=331224f43e4f448483cad2f1185ea965 \
#     npx wrangler kv namespace create SETTLEMENTS
# [[kv_namespaces]]
# binding = "SETTLEMENTS"
# id = "<paste id from `wrangler kv namespace create SETTLEMENTS`>"

[route]
pattern = "infer.x402cloud.ai"
custom_domain = true

# ── Mainnet environment (config only — not deployed by this change) ─────────
# Per docs/MAINNET-RUNBOOK.md §5 step 2. NOTE: unlike facilitator-api/sandbox/
# scrape/marketplace, this app resolves NETWORK through NETWORK_NAME_TO_CAIP2
# (see packages/evm/src/constants.ts, pinned by apps/infer/test/routes.test.ts)
# — it takes the FRIENDLY name ("base-sepolia" today), not the raw CAIP-2
# string, so the mainnet value is "base", not "eip155:8453".
#
# CORRECTION (review finding, radekdymacz/workspace#44): named environments
# do not inherit bindings from the top level, so the [ai] binding above must
# be redeclared here too — without it this environment would deploy with
# NETWORK/FACILITATOR_URL vars but no AI binding, and every inference call
# would throw at runtime.
[env.mainnet]
name = "infer-x402cloud-mainnet"

[env.mainnet.vars]
NETWORK = "base"
FACILITATOR_URL = "https://facilitator-mainnet.x402cloud.ai"
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

[env.mainnet.route]
pattern = "infer-mainnet.x402cloud.ai"
custom_domain = true

[env.mainnet.ai]
binding = "AI"

# Durable settlement recording for mainnet — same shape as the top-level
# comment above, its own namespace (do not reuse the testnet SETTLEMENTS id):
#   CLOUDFLARE_ACCOUNT_ID=331224f43e4f448483cad2f1185ea965 \
#     npx wrangler kv namespace create SETTLEMENTS --env mainnet
# [[env.mainnet.kv_namespaces]]
# binding = "SETTLEMENTS"
# id = "<paste id from the command above>"
