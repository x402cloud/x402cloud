name = "x402cloud-sandbox"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NETWORK = "eip155:84532"
FACILITATOR_URL = "https://facilitator.x402cloud.ai"
# Settlement wallet of the facilitator above (see its /supported endpoint).
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
OPERATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

[route]
pattern = "sandbox.x402cloud.ai"
custom_domain = true

# Cloudflare Sandbox SDK bindings — see sandbox-sdk skill docs.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 1

[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

# ── Mainnet environment (config only — not deployed by this change) ─────────
# Per docs/MAINNET-RUNBOOK.md §5 step 2. The container + Durable Object
# bindings above are not redeclared — per runbook §6 they're provisioned on
# deploy with no separate CLI step, and each `[env.X]` deploys as its own
# Worker script so this environment gets its own Sandbox DO storage for free.
[env.mainnet]
name = "x402cloud-sandbox-mainnet"

[env.mainnet.vars]
NETWORK = "eip155:8453"
FACILITATOR_URL = "https://facilitator-mainnet.x402cloud.ai"
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
OPERATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

[env.mainnet.route]
pattern = "sandbox-mainnet.x402cloud.ai"
custom_domain = true
