name = "x402cloud-scrape"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NETWORK = "eip155:84532"
FACILITATOR_URL = "https://facilitator.x402cloud.ai"
# Settlement wallet of the facilitator above (see its /supported endpoint).
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
OPERATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

[route]
pattern = "scrape.x402cloud.ai"
custom_domain = true

# Cloudflare Browser Rendering binding — see cloudflare:cloudflare skill /
# references/browser-rendering. Local `wrangler dev` does NOT support this
# binding; use `wrangler dev --remote` (set in package.json `dev` script).
[browser]
binding = "BROWSER"

# ── Mainnet environment (config only — not deployed by this change) ─────────
# Per docs/MAINNET-RUNBOOK.md §5 step 2. Browser Rendering itself is
# account-level and needs no separate CLI provisioning step — but per review
# finding radekdymacz/workspace#44, named environments do not inherit
# BINDINGS from the top level, so the [browser] binding above is redeclared
# below; without it this environment would deploy with vars but no BROWSER
# binding and every scrape call would throw at runtime. Per runbook §6:
# confirm Browser Rendering is upgraded off the free tier (10 min/day, 3
# concurrent) before pointing real traffic at this worker — free tier will
# throttle production use.
[env.mainnet]
name = "x402cloud-scrape-mainnet"

[env.mainnet.vars]
NETWORK = "eip155:8453"
FACILITATOR_URL = "https://facilitator-mainnet.x402cloud.ai"
FACILITATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"
OPERATOR_ADDRESS = "0x207C6D8f63Bf01F70dc6D372693E8D5943848E88"

[env.mainnet.route]
pattern = "scrape-mainnet.x402cloud.ai"
custom_domain = true

[env.mainnet.browser]
binding = "BROWSER"
